<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to night mode">&#9789;</button>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    var mql = window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme() {
      var attr = root.getAttribute('data-theme');
      if (attr === 'dark' || attr === 'light') return attr;
      return mql.matches ? 'dark' : 'light';
    }

    function updateButton() {
      var isDark = currentTheme() === 'dark';
      btn.innerHTML = isDark ? '&#9788;' : '&#9789;';
      btn.setAttribute('aria-label', isDark ? 'Switch to day mode' : 'Switch to night mode');
    }

    btn.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try {
        localStorage.setItem('nomonum-theme', next);
      } catch (e) {}
      updateButton();
    });

    updateButton();
  })();
</script>
